name: Test suite

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cobranca
          POSTGRES_PASSWORD: cobranca
          POSTGRES_DB: cobranca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobranca -d cobranca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECT_NAME: cobranca-api
      ENVIRONMENT: test
      POSTGRES_USER: cobranca
      POSTGRES_PASSWORD: cobranca
      POSTGRES_DB: cobranca_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://cobranca:cobranca@localhost:5432/cobranca_test
      JWT_SECRET_KEY: test-only-secret-key-32-bytes-long!!
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile application and tests
        run: python -m compileall -q app tests

      - name: Check PEP8 and Python lint
        run: ruff check app tests --select E,W,F --ignore E501

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker-packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag cobranca-api:ci .

      - name: Start Compose stack
        run: docker compose up --detach --build

      - name: Wait for API health
        run: |
          timeout 90 bash -c '
            until curl --fail --silent http://127.0.0.1:8000/api/v1/health; do
              sleep 2
            done
          '

      - name: Show Compose status
        run: docker compose ps

      - name: Stop Compose stack
        if: always()
        run: |
          docker compose logs api || true
          docker compose down --volumes
