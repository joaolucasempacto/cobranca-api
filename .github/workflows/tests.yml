name: Test suite

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cobranca
          POSTGRES_PASSWORD: cobranca
          POSTGRES_DB: cobranca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobranca -d cobranca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECT_NAME: cobranca-api
      ENVIRONMENT: test
      POSTGRES_USER: cobranca
      POSTGRES_PASSWORD: cobranca
      POSTGRES_DB: cobranca_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://cobranca:cobranca@localhost:5432/cobranca_test
      JWT_SECRET_KEY: test-only-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker-packaging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          JWT_SECRET_KEY: test-only-secret-key
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag cobranca-api:ci .
