name: Migration cycle

on:
  push:
    branches:
      - main
    paths:
      - "app/database/migrations/**"
      - "app/models/**"
      - "alembic.ini"
      - "requirements.txt"
      - ".github/workflows/migration-cycle.yml"

jobs:
  migration-cycle:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cobranca
          POSTGRES_PASSWORD: cobranca
          POSTGRES_DB: cobranca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobranca -d cobranca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECT_NAME: cobranca-api
      ENVIRONMENT: test
      POSTGRES_USER: cobranca
      POSTGRES_PASSWORD: cobranca
      POSTGRES_DB: cobranca_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://cobranca:cobranca@localhost:5432/cobranca_test
      JWT_SECRET_KEY: test-only-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Upgrade to head again
        run: alembic upgrade head

      - name: Verify metadata matches migrations
        run: alembic check
